# Build + tests on a GitHub Windows runner: no GPU and no game data, so the GPU tests skip
# (each prints "SKIPPED <test>: <reason>", counted at the end of scripts/test.ps1) and the
# tests on game data pass without running. What it checks on every push and pull request:
# the workspace builds, the unit / integration tests pass, and the recompiler's HLSL compiles
# with the runner's DXC (Windows SDK).
#
# Left out: the test title's end-to-end run (`test_title_runs_and_game_folder_is_untouched`).
# The runner has no System32\xgameruntime.dll (Gaming Services) and only the Microsoft Basic
# Render Driver (4-lane waves): the launcher warns about both, which that test treats as a
# failure. It still runs in `scripts/test.ps1` on a PC.
#
# Bathyal: a content gate runs first on Ubuntu (seconds). It refuses game material, binaries, files over 1 MiB,
# title names and network crates (scripts/check_content.py), and decides whether the change touches code. The
# Windows build only runs when the gate passes and the change is more than docs, so a docs-only pull request
# costs no Windows runner time. Both jobs report a status, so either can be a required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Content gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Content check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 -I scripts/check_content.py --base "origin/${{ github.base_ref }}"
          else
            python3 -I scripts/check_content.py
          fi

      - name: Does the change touch code?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -q -v -E '\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files: $(echo "$files" | wc -l)"

  windows:
    name: Build and test (Windows, no GPU)
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build and test
        shell: pwsh
        run: ./scripts/test.ps1 --skip test_title_runs_and_game_folder_is_untouched
